#====Clash-meta精简配置文件模版：更新至15个主流节点（V23.11.12）=====
#====参考自clash-meta官方文档：wiki.metacubex.one=====

#（一区）=============================（clash配置）
#dns可自行修改
port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
ipv6: true
dns:
  enable: true
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: 
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - tls://dns.google
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4   
      
#==============================（hysteria2自签节点）
- name: hysteria2-sg                            #可自定义名称
  type: hysteria2                                      
  server: 2403:cfc0:1114:a2:e1::e74a                                     #服务器本地IP
  port: 1151                                         #自定义的端口，不支持多端口
  password: 019513dc-7a90-4c36-9e27-4a2145fb5cb5                                    #自定义的密码
  alpn:
    - h3
  sni: www.bing.com                                    #自签证书
  skip-cert-verify: true
  fast-open: true
  
#==============================（tuic-V5证书节点）
- name: tuic-jp                              #可自定义名称
  server: 2a12:bec0:166:10::                          #解析的域名或IP
  port: 1000                                     #自定义的端口
  type: tuic
  uuid: e9f2d1ba-cfa8-4bfc-b832-386e2ec8a98b       #自定义的uuid
  password: e9f2d1ba-cfa8-4bfc-b832-386e2ec8a98b   #自定义的密码
  alpn: [h3]
  disable-sni: true
  reduce-rtt: true
  udp-relay-mode: native
  congestion-controller: bbr
  sni: www.bing.com                            #sni域名，与上面server地址一致     
  skip-cert-verify: true


#==============================（tuic-V5自签节点）
- name: tuic-sg                              #可自定义名称
  server: 2403:cfc0:1114:a2:e1::e74a                                   #服务器本地IP
  port: 1152                                      #自定义的端口
  type: tuic
  uuid:  019513dc-7a90-4c36-9e27-4a2145fb5cb5       #自定义的uuid
  password:  019513dc-7a90-4c36-9e27-4a2145fb5cb5   #自定义的密码
  alpn: [h3]
  disable-sni: true
  reduce-rtt: true
  udp-relay-mode: native
  congestion-controller: bbr
  sni: www.bing.com                                 #自签证书   
  skip-cert-verify: true
  
#（三区）==============================（代理分流）
#分流组可自行创建添加，proxies参数下的name节点名称，按需求自行增减，确保出现的name节点名称在二区代理协议中可查找
proxy-groups:
- name: 负载均衡
  type: load-balance
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  strategy: round-robin
  proxies:
    - hysteria2-sg                                  #自定义添加协议的name字段
    - tuic-jp
    - tuic-sg

- name: 自动选择
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
    - hysteria2-sg                                  #自定义添加协议的name字段
    - tuic-jp
    - tuic-sg
    
- name: 🌍选择代理节点
  type: select
  proxies:
    - 负载均衡                                            #自定义添加协议的name字段
    - 自动选择
    - DIRECT
    - hysteria2-sg                                  #自定义添加协议的name字段
    - tuic-jp
    - tuic-sg


#（四区）==============================（代理规则）
#代理规则可自行添加 
rules:
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点
